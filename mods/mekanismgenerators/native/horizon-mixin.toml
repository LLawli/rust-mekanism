# O clique na aba de calor (`GuiHeatTab.onClick`): troca a unidade de temperatura do cliente e toma o clique. `screen_click` não serve, porque
# o clique que ele toma vira um `ContainerButtonClick` para o servidor e o som do botão, e a aba de calor não tem nenhum dos dois.
[[injection]]
id = "heat_tab_press"
hook = "screen_mouse_button_pressed_pre"
hook_version = 1
kind = "HEAD"
helper = "heat_tab_press.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "button", ty = "i32", value = "button" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

# Os tooltips da barra de energia e do medidor de lava ficam por cima ou por baixo do widget, e não sobre o cursor.
[[injection]]
id = "widget_tooltip"
target = "horizon_client::game::native_hooks::Game<'_>::draw_native_screen_tooltip"
kind = "HEAD"
cancellable = true
helper = "widget_tooltip.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
]

# Antes de cada clique do jogador no menu de uma máquina (`lan_machine_click`, que o servidor roda para o anfitrião e para os convidados):
# deixa a regra de `InventoryContainerSlot.mayPlace` do gerador aberto onde o hook `menu_slot_rules` a lê. Esse hook roda dentro do menu,
# sem o jogo, e a regra do combustível precisa do tempo de queima. Alvo cru, o mesmo da injeção `result_take_before` do Mekanism.
[[injection]]
id = "menu_click_before"
target = "horizon_client::game::lan_crafting::Game<'_>::lan_machine_click"
kind = "HEAD"
helper = "menu_click_before.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "host", ty = "&crate::game::lan::LanHost", value = "&*host" },
  { name = "conn", ty = "u32", value = "conn" },
]

[[injection]]
id = "has_analog_output"
hook = "has_analog_output"
hook_version = 1
kind = "HEAD"
helper = "has_analog_output.rs"
bindings = [
  { name = "level", ty = "&GameLevel<'_>", value = "self" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "output", ty = "&mut bool", value = "&mut *output" },
]

[[injection]]
id = "analog_output"
hook = "analog_output"
hook_version = 1
kind = "HEAD"
helper = "analog_output.rs"
bindings = [
  { name = "dimension", ty = "LevelDimension", value = "dimension" },
  { name = "pos", ty = "BlockPos", value = "pos" },
  { name = "output", ty = "&mut i32", value = "&mut *output" },
]

# Os arquivos de configuração de servidor do Generators (`Mekanism/generators.toml` e `Mekanism/generator-storage.toml`, o `MekanismGeneratorsConfig`): registrar, ler
# quando o servidor de um mundo vai começar e ler de novo quando o arquivo muda (`ModContainer.registerConfig`, `ModConfigEvent.Loading` e `Reloading`). O Heat
# Generator lê deles o calor, o tanque, o consumo de lava e a capacidade de energia.
[[injection]]
id = "register-configs"
hook = "register_configs"
hook_version = 1
kind = "HEAD"
helper = "register_configs.rs"
bindings = [
  { name = "configs", ty = "&mut Vec<crate::game::NativeConfig>", value = "&mut *configs" },
]

[[injection]]
id = "config-loading"
hook = "config_loading"
hook_version = 1
kind = "HEAD"
helper = "config_loading.rs"
bindings = [
  { name = "config", ty = "&crate::game::NativeConfigFile", value = "config" },
]

[[injection]]
id = "config-reloading"
hook = "config_reloading"
hook_version = 1
kind = "HEAD"
helper = "config_reloading.rs"
bindings = [
  { name = "config", ty = "&crate::game::NativeConfigFile", value = "config" },
]

# O animador do Heat Generator (`BlockTile.animateTick`) é registrado em `machinery_basis` no `tick` do cliente (`tick` roda no cliente e no servidor).
[[injection]]
id = "client_tick"
hook = "tick"
hook_version = 1
kind = "HEAD"
helper = "client_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# A linha de jogo de cada estado dos blocos do Generators (luz do estado ativo e da lava, reação ao pistão, oclusão), que `properties` não alcança: a mesma injeção do
# Mekanism (`active_light`), com a tabela do Generators, gerada do original em jogo e testada em `tests/blocos_registry.rs`. Alvo cru, H18 e H49.
[[injection]]
id = "block_rows"
target = "horizon_client_lib::mod_content::Plan<'_>::override_gameplay"
kind = "HEAD"
helper = "block_rows.rs"
bindings = [
  { name = "block", ty = "&NewBlock<'_>", value = "b" },
  { name = "combo", ty = "&[(String, String)]", value = "combo" },
  { name = "row", ty = "&mut J", value = "&mut *row" },
]

# A tabela das linhas de jogo dos blocos do Generators. Vai para o arquivo do `Plan`, onde está `block_rows`.
[[module]]
id = "block-rows"
file = "crates/horizon-client/src/mod_content.rs"
name = "mekanismgenerators_rows"
source = "block_rows_table.rs"

# O que o Generators acrescenta às abas do vanilla (`GeneratorsCreativeTabs.addToExistingTabs`), no RETURN de `Plan::creative_tabs`, como a injeção `creative_tabs` do Mekanism.
# Alvo cru, H43. O resultado vem antes do `doc` nos `bindings`: o Horizon aninha as duas injeções RETURN (a do Mekanism fica por dentro), e `&mut *doc` antes do resultado interno
# seria um segundo empréstimo mutável.
[[injection]]
id = "creative_tabs"
target = "horizon_client_lib::mod_content::Plan<'_>::creative_tabs"
kind = "RETURN"
helper = "creative_tabs.rs"
bindings = [
  { name = "result", ty = "Result<()>", value = "$value" },
  { name = "doc", ty = "&mut J", value = "&mut *doc" },
]

# A lista que o Generators põe nas abas do vanilla (código puro, gerado do original em jogo e testado em `tests/creative_tabs.rs`).
[[module]]
id = "creative-tabs-table"
file = "crates/horizon-client/src/mod_content.rs"
name = "mekanismgenerators_tabs"
source = "creative_tabs_table.rs"

# A linha de energia guardada no tooltip do item do Heat Generator (`MekanismDataComponents.ATTACHED_ENERGY`).
[[injection]]
id = "tooltip"
hook = "tooltip"
hook_version = 1
kind = "HEAD"
helper = "tooltip.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "lines", ty = "&mut Vec<(horizon_client::mod_api::Text, u32)>", value = "&mut *lines" },
]

# `skipRendering` do vidro do Mekanism e do Generators (decisão 30 e H51): o original pula a face entre o vidro estrutural, o vidro do reator e a matriz de foco do laser pela hierarquia de classes
# (`BlockTileGlass`, `BlockReactorGlass`, `BlockLaserFocusMatrix`), e a regra `same_block` do Horizon só pula entre estados do mesmo bloco. A tabela (o estado padrão de cada um dos três, em `block_render.rs`)
# é anotada no HEAD de `FaceVisibility::new`, que tem o registro, e consultada no HEAD cancelável de `FaceVisibility::skips`, a conta por face do mesher. Alvos crus, H51.
[[module]]
id = "glass-skip"
file = "crates/horizon-world/src/block_render.rs"
name = "mekanismgenerators_glass"
source = "glass_skip_table.rs"
visibility = "pub"

[[injection]]
id = "glass_ids"
target = "horizon_world::block_render::FaceVisibility::new"
kind = "HEAD"
helper = "glass_ids.rs"
bindings = [
  { name = "occlusion", ty = "&CachedCollisionRegistry<'_>", value = "occlusion" },
]

[[injection]]
id = "glass_skip"
target = "horizon_world::block_render::FaceVisibility::skips"
kind = "HEAD"
cancellable = true
helper = "glass_skip.rs"
bindings = [
  { name = "own", ty = "State", value = "a" },
  { name = "other", ty = "State", value = "b" },
]

# A aba de segurança (`GuiSecurityTab`): o clique esquerdo ou o direito vira o botão de menu que o servidor trata (`PacketGuiInteract(NEXT_SECURITY_MODE)`), e o servidor troca o
# modo do tile (`incrementSecurityMode`). Os mesmos hooks que o `mekanism` usa para as telas dele.
[[injection]]
id = "screen_click"
hook = "screen_click"
hook_version = 1
kind = "HEAD"
helper = "screen_click.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "at", ty = "[f32; 2]", value = "at" },
  { name = "right", ty = "bool", value = "right" },
  { name = "button", ty = "&mut Option<i32>", value = "&mut *button" },
]

[[injection]]
id = "menu_button"
hook = "menu_button"
hook_version = 1
kind = "HEAD"
helper = "menu_button.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
  { name = "id", ty = "i32", value = "id" },
]
