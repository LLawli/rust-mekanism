[mod]
id = "mekanismgenerators_native"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "f319701e8c9ab657ff562250b3ba07b2d654e3bc"

[api]
path = "api"

[dependencies]
machinery_basis = "^0.1"

[[module]]
id = "rules"
file = "crates/horizon-client/src/game.rs"
name = "mekanismgenerators_rules"
source = "runtime.rs"

[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "mekanismgenerators_glue"
source = "glue.rs"

[[injection]]
id = "block_entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "&mut *entity" },
]

[[injection]]
id = "block_entity_ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "block_entity_ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "block_entity_energy"
hook = "block_entity_energy"
hook_version = 1
kind = "HEAD"
helper = "block_entity_energy.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "energy", ty = "&mut Option<horizon_client::containers::ModEnergyBuffer>", value = "&mut *energy" },
]

[[injection]]
id = "block_entity_container"
hook = "block_entity_container"
hook_version = 1
kind = "HEAD"
helper = "block_entity_container.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<horizon_client::containers::ModContainer>", value = "&mut *container" },
]

[[injection]]
id = "block_entity_tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "block_entity_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
]

# O nome do tile (`TileEntityMekanism.customName`), o componente inteiro: o item que o coloca, o item solto, o título da tela e o nome que o
# Horizon tira do mundo antes de rolar a tabela de loot (`destroy_block` o guarda). A lógica é da `machinery_basis`.
[[injection]]
id = "place_block"
hook = "place_block"
hook_version = 1
kind = "HEAD"
helper = "place_block.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
]

[[injection]]
id = "loot_drops"
hook = "loot_drops"
hook_version = 1
kind = "HEAD"
helper = "loot_drops.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "context", ty = "&horizon_client::mod_api::NativeLootDrops<'_>", value = "context" },
  { name = "drops", ty = "&mut Vec<horizon_client::items::ItemStack>", value = "&mut *drops" },
]

[[injection]]
id = "container_opened"
hook = "container_opened"
hook_version = 1
kind = "HEAD"
helper = "container_opened.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "u128", value = "player" },
  { name = "pos", ty = "Option<[i32; 3]>", value = "pos" },
]

[[injection]]
id = "destroy_block"
hook = "destroy_block"
hook_version = 1
kind = "HEAD"
helper = "destroy_block.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

[[injection]]
id = "screen"
hook = "screen"
hook_version = 1
kind = "HEAD"
helper = "screen.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "screen", ty = "&mut Option<horizon_client::mod_api::NativeScreen>", value = "&mut *screen" },
]

[[injection]]
id = "screen_draw"
hook = "screen_draw"
hook_version = 1
kind = "HEAD"
helper = "screen_draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "data", ty = "&[i32]", value = "data" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "origin", ty = "[f32; 2]", value = "origin" },
]

[[injection]]
id = "menu_quick_move"
hook = "menu_quick_move"
hook_version = 1
kind = "HEAD"
helper = "menu_quick_move.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
  { name = "container_slots", ty = "usize", value = "container_slots" },
  { name = "slot", ty = "usize", value = "slot" },
  { name = "stack", ty = "&mut horizon_client::items::ItemStack", value = "&mut *stack" },
  { name = "handled", ty = "&mut bool", value = "&mut *handled" },
]

[[injection]]
id = "block_entity_update_tag"
hook = "block_entity_update_tag"
hook_version = 1
kind = "HEAD"
helper = "block_entity_update_tag.rs"
bindings = [
  { name = "entity", ty = "&horizon_client::containers::ModBlockEntity", value = "entity" },
  { name = "tag", ty = "&mut Option<horizon_world::nbt::Compound>", value = "&mut *tag" },
]

# O clique na aba de calor (`GuiHeatTab.onClick`): troca a unidade de temperatura do cliente e toma o clique. `screen_click` não serve, porque
# o clique que ele toma vira um `ContainerButtonClick` para o servidor e o som do botão, e a aba de calor não tem nenhum dos dois.
[[injection]]
id = "heat_tab_press"
hook = "screen_mouse_button_pressed_pre"
hook_version = 1
kind = "HEAD"
helper = "heat_tab_press.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "screen", ty = "&horizon_client::mod_api::NativeScreenView<'_>", value = "screen" },
  { name = "button", ty = "i32", value = "button" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

# Os tooltips da barra de energia e do medidor de lava ficam por cima ou por baixo do widget, e não sobre o cursor.
[[injection]]
id = "widget_tooltip"
target = "horizon_client::game::native_hooks::Game<'_>::draw_native_screen_tooltip"
kind = "HEAD"
cancellable = true
helper = "widget_tooltip.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
]

# Antes de cada clique do jogador no menu de uma máquina (`lan_machine_click`, que o servidor roda para o anfitrião e para os convidados):
# deixa a regra de `InventoryContainerSlot.mayPlace` do gerador aberto onde o hook `menu_slot_rules` a lê. Esse hook roda dentro do menu,
# sem o jogo, e a regra do combustível precisa do tempo de queima. Alvo cru, o mesmo da injeção `result_take_before` do Mekanism.
[[injection]]
id = "menu_click_before"
target = "horizon_client::game::lan_crafting::Game<'_>::lan_machine_click"
kind = "HEAD"
helper = "menu_click_before.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "host", ty = "&crate::game::lan::LanHost", value = "&*host" },
  { name = "conn", ty = "u32", value = "conn" },
]
