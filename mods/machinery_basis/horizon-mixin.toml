[mod]
id = "machinery_basis"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "f319701e8c9ab657ff562250b3ba07b2d654e3bc"

[api]
path = "api"

[[crate]]
id = "core"
path = "core"

[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "machinery_basis"
source = "glue.rs"

[[module]]
id = "slot-accepts"
file = "crates/horizon-client/src/game/machines/native_items.rs"
name = "machinery_slot_accepts"
source = "slot_accepts.rs"

[[injection]]
id = "reload-listeners"
hook = "add_server_reload_listeners"
hook_version = 1
kind = "HEAD"
helper = "reload_listeners.rs"
bindings = [
  { name = "listeners", ty = "&mut Vec<crate::game::NativeReloadListener>", value = "&mut *listeners" },
]

[[injection]]
id = "reload-apply"
hook = "server_reload_listener_apply"
hook_version = 1
kind = "HEAD"
helper = "reload_apply.rs"
bindings = [
  { name = "listener", ty = "&crate::game::NativeReloadListener", value = "listener" },
  { name = "files", ty = "&[(String, serde_json::Value)]", value = "files" },
]

# O Horizon só reconhece fluido em bloco para água. Esta linha da tabela de fatos faz o estado
# `fluid_logged=lava` de um bloco de mod ser uma fonte de lava de verdade para o motor de fluidos.
[[injection]]
id = "logged-fluid-row"
target = "horizon_client_lib::mod_content::set_state_properties"
kind = "HEAD"
helper = "logged_fluid_row.rs"
bindings = [
  { name = "row", ty = "&mut J", value = "&mut *row" },
  { name = "combo", ty = "&[(String, String)]", value = "combo" },
]

[[injection]]
id = "update-shape"
hook = "update_shape"
hook_version = 1
kind = "HEAD"
helper = "update_shape.rs"
bindings = [
  { name = "level", ty = "&GameLevel<'_>", value = "self" },
  { name = "ticks", ty = "&mut Ticks", value = "&mut *ticks" },
  { name = "pos", ty = "BlockPos", value = "pos" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "direction", ty = "Direction", value = "direction" },
  { name = "neighbour", ty = "BlockStateId", value = "neighbour" },
  { name = "new", ty = "&mut Option<BlockStateId>", value = "&mut *new" },
]

[[injection]]
id = "state_for_placement"
hook = "state_for_placement"
hook_version = 1
kind = "HEAD"
helper = "state_for_placement.rs"
bindings = [
  { name = "level", ty = "&GameLevel<'_>", value = "self" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "context", ty = "&PlacementContext", value = "context" },
  { name = "answer", ty = "&mut Option<Option<BlockStateId>>", value = "&mut *answer" },
]

[[injection]]
id = "use_item_on"
hook = "use_item_on"
hook_version = 1
kind = "HEAD"
helper = "use_item_on.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

[[injection]]
id = "use_item"
hook = "use_item"
hook_version = 1
kind = "HEAD"
helper = "use_item.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

[[injection]]
id = "block_entity_submit"
hook = "block_entity_submit"
hook_version = 1
kind = "HEAD"
helper = "block_entity_submit.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "draw", ty = "&mut crate::game::native_block_entity_draw::BlockEntityDraw", value = "&mut *draw" },
]

[[injection]]
id = "server_data_loaded"
hook = "server_data_loaded"
hook_version = 1
kind = "HEAD"
helper = "server_data_loaded.rs"
bindings = []

# A capacidade de energia de uma máquina muda com os upgrades, e o `ModEnergyBuffer` do bloco é um só. Quem anda diz a capacidade
# da instância, e a injeção responde com ela no lugar da do bloco, no mesmo ponto que o spike validou para as faces por instância.
[[injection]]
id = "energy_capacity"
target = "horizon_client::game::machines::native_energy::Game<'_>::native_energy_at"
kind = "HEAD"
cancellable = true
helper = "energy_capacity.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
]
