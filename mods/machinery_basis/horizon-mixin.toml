# O fundo escurecido de uma tela de máquina. O Horizon pinta a janela toda de uma tela de contêiner com um retângulo fixo `rgba(16, 16, 16, 160)`
# (`draw_inventory`), e o original desenha `fillGradient(0, 0, width, height, 0xC0101010, 0xD0101010)` (`Screen.extractTransparentBackground`, porque
# `AbstractContainerScreen.isInGameUi` é verdadeiro). O HEAD de `HudBatch::fill` troca esse retângulo, e só ele (a janela toda, com essa cor), pelo degradê do
# vanilla quando a tela aberta é de uma máquina nossa; o `HudBatch` não conhece o `Game`, então o módulo guarda o estado e o HEAD de `draw_inventory` o escreve
# (o `frame` o limpa quando a tela fecha). O baú e a fornalha do vanilla ficam com o retângulo do Horizon. Alvos crus: dependem de `HudBatch::fill`, de
# `draw_inventory` e da cor do retângulo.
[[module]]
id = "container-dim"
file = "crates/horizon-client-render/src/hud.rs"
name = "machinery_container_dim"
source = "container_dim_state.rs"
visibility = "pub"

