# O contêiner de itens por instância (H2). O `ModContainer` de um bloco de mod é o do tipo de bloco, e os hoppers, o dropper e `native_insert_item`
# leem as faces e os slots dele. Uma máquina com lados coloridos (`ConfigHolder`) tem faces diferentes em cada instância, e a regra do slot de quem está
# de fora (`isValidForExtraction`) não está no `can_take`. A primeira injeção (HEAD cancelável, porque o corpo de `view` tem `?` e o RETURN não o aceita)
# chama `view` de novo por dentro e troca o contêiner do `View` pelo da instância; a segunda responde `can_take` com a face e a regra do slot. A entrada
# (`isValidForInsertion` com a face) já passa pelo hook `container_accepts`, que o mod ouve.
[[injection]]
id = "container_instance"
target = "horizon_client::game::machines::Containers<'_>::view"
kind = "HEAD"
cancellable = true
helper = "container_instance.rs"
bindings = [
  { name = "containers", ty = "&Containers<'_>", value = "&*self" },
  { name = "pos", ty = "Pos", value = "pos" },
  { name = "blocked_chests", ty = "bool", value = "blocked_chests" },
]

[[injection]]
id = "container_take"
target = "horizon_client::game::machines::Containers<'_>::can_take"
kind = "HEAD"
cancellable = true
helper = "container_take.rs"
bindings = [
  { name = "containers", ty = "&Containers<'_>", value = "&*self" },
  { name = "view", ty = "&View", value = "view" },
  { name = "slot", ty = "usize", value = "slot" },
  { name = "stack", ty = "&ItemStack", value = "stack" },
  { name = "face", ty = "Direction", value = "face" },
]

# `IItemHandler.isItemValid` da capability de item de uma face (H2): o Horizon pergunta, antes de um hopper, um dropper ou `native_insert_item` pôr um item num
# slot que o `ModContainer` deixa encher, e responde pelo que o mod disser. A face da instância tem de deixar entrar e o slot tem de aceitar o item de quem está
# de fora. Alvo cru: o hook `container_accepts` existe no `main` do Horizon (`tools/native-hook-fragments/container_accepts.json`) e não no catálogo do pin
# (`E_HOOK_UNKNOWN`, medido), mas `native_container_accepts` já faz a pergunta com a face; a injeção entra no começo dela e é o hook que o `main` já tem.
# Quem responde por um bloco se registra em `register_item_instances`, como nas duas de cima: a injeção é da lib e serve a todo mod.
[[injection]]
id = "container_accepts"
target = "horizon_client::game::native_hooks::Game<'_>::native_container_accepts"
kind = "HEAD"
helper = "container_accepts.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&horizon_client::containers::ModBlockEntity", value = "entity" },
  { name = "slot", ty = "usize", value = "slot" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "face", ty = "Option<horizon_core::geometry::Direction>", value = "face" },
  { name = "cancel", ty = "&mut bool", value = "&mut *cancel" },
]

# O `TransporterItemHandler` no jogo (frente `transportador-jogo`): o item que um funil, um dropper ou o ejetor de outra máquina põe num transportador logístico. Todo contêiner de bloco recebe
# por `Game::move_in_item` (`tryMoveInItem`, privada de `machines`), e a capability do transportador não é um slot: o HEAD cancelável responde pelo bloco que o dono dos transportadores conhece
# (a inserção no caminho, o que sobra volta a quem pôs) e deixa o corpo original para os outros. Alvo cru; o hook mais próximo seria `container_accepts` com a pergunta de inserir de verdade.
[[injection]]
id = "transporter_insert"
target = "horizon_client::game::machines::Game<'_>::move_in_item"
kind = "HEAD"
cancellable = true
helper = "transporter_insert.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "view", ty = "&View", value = "view" },
  { name = "stack", ty = "&ItemStack", value = "&stack" },
  { name = "face", ty = "Option<horizon_core::geometry::Direction>", value = "face" },
]

