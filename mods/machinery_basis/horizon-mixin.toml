# A ordem de desenho dos slots: itens, janela, itens virtuais, e o tooltip e o item no cursor por cima. Alvo cru.
[[injection]]
id = "window_draw_slots"
target = "horizon_client::game::Game<'_>::draw_inventory_slots"
kind = "HEAD"
cancellable = true
helper = "window_draw_slots.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "ox", ty = "f32", value = "ox" },
  { name = "oy", ty = "f32", value = "oy" },
]

# O alvo do mouse: um slot coberto pela janela não pode ser alvo, e o virtual dela sim. Alvo cru.
[[injection]]
id = "window_slot_at"
target = "horizon_client::game::Game<'_>::slot_at"
kind = "RETURN"
helper = "window_slot_at.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "found", ty = "Option<usize>", value = "$value" },
  { name = "x", ty = "f32", value = "x" },
  { name = "y", ty = "f32", value = "y" },
]

# Os sprites animados e interpolados que uma tela de mod desenha ganham a mistura do original. O módulo guarda os retângulos do atlas
# que `sprite_tinted` e `tiled_sprite` registram, e o HEAD de `animate_sprites` mistura esses sprites antes do laço do Horizon. Alvo cru.
[[module]]
id = "sprite-ties"
file = "crates/horizon-client-render/src/hud.rs"
name = "machinery_sprite_ties"
source = "sprite_ties.rs"
visibility = "pub"

[[injection]]
id = "sprite_ties"
target = "horizon_client_render::hud::HudRenderer::animate_sprites"
kind = "HEAD"
helper = "sprite_ties_head.rs"
bindings = [
  { name = "hud", ty = "&mut HudRenderer", value = "&mut *self" },
  { name = "uploads", ty = "&mut crate::gfx::upload::Uploads", value = "&mut *uploads" },
  { name = "encoder", ty = "&mut wgpu::CommandEncoder", value = "&mut *encoder" },
  { name = "tick", ty = "u64", value = "tick" },
]
