# O mesher lê o fluido de cada estado em `FluidState::from_block(registry.state(id))` dentro de `MeshTables::new`, que só conhece a água, a lava e `waterlogged`, e a função tem
# `?` e closures (nada além de HEAD e MODIFY_VARIABLE entra nela; o `from_block` tem `Self` no retorno e `?` no corpo). O HEAD de `MeshTables::new` liga, nesta thread, o
# modo "montando a tabela do mesher"; o RETURN de `BlockRegistry::state` devolve, nesse modo, o estado da fonte de água ou de lava a um bloco com `fluid_logged=water` ou `lava`
# (`IStateFluidLoggable.getFluid`, `getSource(false)`), e o modo se desliga sozinho no último estado. Fora da montagem o `state` devolve o estado de sempre. Alvos crus, H3.
[[module]]
id = "logged-fluid-view"
file = "crates/horizon-world/src/registry.rs"
name = "machinery_logged_fluid"
source = "logged_fluid_view.rs"
visibility = "pub"

