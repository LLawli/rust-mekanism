]

# A forma de oclusão real de cada bloco de mod que declara `shapes` (e o centro dos canos e cabos de `thickness`), em `occlusion.nbt` (decisão 22 e H51). O Horizon copia para um bloco de mod a forma
# de oclusão do gabarito e o mod não tem como dizer a dele. O HEAD cancelável de `tables` a chama de novo por dentro (a marca de reentrada deixa o corpo original escrever as tabelas todas; o RETURN
# não aceita o `?` do corpo), depois lê `occlusion.nbt` do overlay, troca o índice de forma de cada estado e a reescreve, como `Plan::collision_shapes` faz com `cached-collision.nbt`, e põe
# `can_occlude` verdadeiro em `render-definitions.json` nos canos e cabos. Alvo cru, H51.
[[injection]]
id = "occlusion_shapes"
target = "horizon_client_lib::mod_content::tables"
kind = "HEAD"
cancellable = true
helper = "occlusion_shapes.rs"
bindings = [
  { name = "base", ty = "&Path", value = "base" },
  { name = "plan", ty = "&Plan<'_>", value = "plan" },
  { name = "overlay", ty = "&Overlay<'_>", value = "overlay" },
]

# O `Kd` e o `neoforge_TintIndex` do `.mtl` (H16): o `parse_mtl` do Horizon lê só o `map_Kd`, e o NeoForge multiplica a cor `Kd` na de cada vértice (`ObjGeometry.makeQuad`) e dá ao quad o
# índice de tinta do material. Os materiais dos cabos têm `Kd 0.8`: sem isso o corpo sai 20% mais claro que o do original. Um módulo (a conta do `.mtl`, em `obj.rs` do `horizon-assets`,
# que `core/tests/obj_material.rs` compila como está) e duas injeções cruas: o fim de `parse_mtl` guarda as duas propriedades de cada material no mapa que ela devolve, sob uma chave
# que nenhuma face usa, e o começo de `bake_obj` (HEAD cancelável, porque o corpo tem `?` e o RETURN não o aceita) o chama de novo e põe as duas nos quads que ele acabou de cozinhar.
[[module]]
id = "obj-material"
file = "crates/horizon-assets/src/obj.rs"
name = "machinery_obj_material"
source = "obj_material.rs"

[[injection]]
id = "obj_material_parse"
target = "horizon_assets::obj::parse_mtl"
kind = "RETURN"
helper = "obj_material_parse.rs"
bindings = [
  { name = "value", ty = "BTreeMap<String, MtlTexture>", value = "$value" },
  { name = "text", ty = "&str", value = "text" },
]

[[injection]]
id = "obj_material_quads"
target = "horizon_assets::bake::bake_obj"
kind = "HEAD"
cancellable = true
helper = "obj_material_quads.rs"
bindings = [
  { name = "model", ty = "&ResolvedCuboidModel", value = "model" },
  { name = "obj", ty = "&ObjModel", value = "obj" },
  { name = "flip_v", ty = "bool", value = "flip_v" },
  { name = "shade", ty = "bool", value = "shade" },
  { name = "hidden", ty = "&std::collections::BTreeSet<String>", value = "hidden" },
  { name = "transform", ty = "BlockModelTransform", value = "transform" },
  { name = "output", ty = "&mut Vec<ModelQuad>", value = "&mut *output" },
]
