# O menu de cada jogador, no começo do tick do servidor (`ServerTickEvent.Pre`): quem fechou o menu (ou saiu sem fechar: conexão perdida, longe demais,
# morreu) deixa a sessão, a janela de upgrades escolhida e o acompanhamento para trás, e o espectador conta (`MekanismTileContainer.openInventory` não olha
# o modo de jogo; o hook `mod_container_viewers` do jogo só conta quem não é espectador); depois o `MekanismContainer.broadcastChanges` de todos os menus
# abertos: o `ServerPlayer.tick` do original o lê antes dos block entities, com o valor vivo de cada dado, e o cliente recebe o estado do fim do tick
# anterior (o overlay de 0,98 da barra de energia depende disso). Também a cada passada com o servidor parado, onde o jogador continua andando.
[[injection]]
