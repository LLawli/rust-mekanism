# O Horizon só reconhece fluido em bloco para água. Esta linha da tabela de fatos faz o estado
# `fluid_logged=lava` de um bloco de mod ser uma fonte de lava de verdade para o motor de fluidos.
[[injection]]
id = "logged-fluid-row"
target = "horizon_client_lib::mod_content::set_state_properties"
kind = "HEAD"
helper = "logged_fluid_row.rs"
bindings = [
  { name = "row", ty = "&mut J", value = "&mut *row" },
  { name = "combo", ty = "&[(String, String)]", value = "combo" },
]

# O mesher lê o fluido de cada estado em `FluidState::from_block(registry.state(id))` dentro de `MeshTables::new`, que só conhece a água, a lava e `waterlogged`, e a função tem
# `?` e closures (nada além de HEAD e MODIFY_VARIABLE entra nela; o `from_block` tem `Self` no retorno e `?` no corpo). O HEAD de `MeshTables::new` liga, nesta thread, o
# modo "montando a tabela do mesher"; o RETURN de `BlockRegistry::state` devolve, nesse modo, o estado da fonte de água ou de lava a um bloco com `fluid_logged=water` ou `lava`
# (`IStateFluidLoggable.getFluid`, `getSource(false)`), e o modo se desliga sozinho no último estado. Fora da montagem o `state` devolve o estado de sempre. Alvos crus, H3.
[[module]]
id = "logged-fluid-view"
file = "crates/horizon-world/src/registry.rs"
name = "machinery_logged_fluid"
source = "logged_fluid_view.rs"
visibility = "pub"

[[injection]]
id = "logged_fluid_begin"
target = "horizon_client_render::mesher::MeshTables::new"
kind = "HEAD"
helper = "logged_fluid_begin.rs"
bindings = [
  { name = "facts", ty = "&BlockFacts", value = "facts" },
]

[[injection]]
id = "logged_fluid_view"
target = "horizon_world::registry::BlockRegistry::state"
kind = "RETURN"
helper = "logged_fluid_state.rs"
bindings = [
  { name = "value", ty = "Option<&BlockState>", value = "$value" },
  { name = "id", ty = "BlockStateId", value = "id" },
]

# O `StateFacts.fluid` do `horizon-items` (o fluido que o mob, o item solto e o raio do balde leem, em 164 lugares) vem do nome do bloco e de `waterlogged`, calculado em `decode_with_callback`
# (genérico, que o horizon-mixins recusa), e as cinco entradas de `BlockFacts` devolvem `Self` no resultado (RETURN e HEAD cancelável recusam: `E_UNSUPPORTED_SIGNATURE`). O HEAD cancelável de
# `gameplay_tables` (`game.rs`, a carga das fatos que o jogo faz) a chama de novo por dentro e dá a fonte de água ou de lava, na tabela já pronta, aos estados com `fluid_logged=water` ou `lava`
# (decisão 88). Alvo cru, H3.
[[module]]
id = "logged-fluid-facts"
file = "crates/horizon-client/src/game.rs"
