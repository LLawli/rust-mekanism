hook_version = 1
kind = "HEAD"
helper = "component_types.rs"
bindings = [
  { name = "types", ty = "&mut Vec<String>", value = "&mut *types" },
]

# O modelo do upgrade escolhido pelo componente: o original usa um modelo de item próprio (`mekanism:component_item`), e aqui
# a propriedade de condição `mekanism:upgrade_type/<tipo>` faz o mesmo papel.
# `mekanism:component_item` não existe no Horizon: o arquivo do item fica igual ao do original, e o tipo é decodificado aqui.
[[injection]]
id = "component_item_model"
target = "horizon_assets::item_model::foreign::decode_node"
kind = "HEAD"
cancellable = true
helper = "component_item_model.rs"
bindings = [
  { name = "kind", ty = "&str", value = "kind" },
  { name = "m", ty = "&Map<String, Value>", value = "m" },
]

