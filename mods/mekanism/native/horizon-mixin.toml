target = "horizon_client_lib::mod_content::Plan<'_>::creative_tabs"
kind = "RETURN"
helper = "creative_tabs.rs"
bindings = [
  { name = "doc", ty = "&mut J", value = "&mut *doc" },
  { name = "result", ty = "Result<()>", value = "$value" },
]

# `BlockOre.getExpDrop` da fluorita (1 a 4, `OreType.FLUORITE`): o Horizon só sorteia experiência de minério pelo nome do vanilla (`Game::block_experience`, que
# devolve 0 para um bloco de mod), então o RETURN dele troca o 0 pelo sorteio da fluorita. O gerador do nível está emprestado dentro do corpo
# (o `return` do spawner), então o sorteio é o `Math.random()` do Java. Alvo cru, H42.
[[injection]]
id = "fluorite_experience"
target = "horizon_client::game::Game<'_>::block_experience"
kind = "RETURN"
helper = "fluorite_experience.rs"
bindings = [
  { name = "name", ty = "&str", value = "name" },
  { name = "value", ty = "u32", value = "$value" },
]

