# A aba criativa do Mekanism pede mais do que o Horizon faz com o arquivo `creative_tab/mekanism.json` (só ids): as pilhas de upgrade com o componente de tipo e o que o
# original acrescenta às abas do vanilla (`MekanismCreativeTabs.addToExistingTabs`). A tabela e a conta são código puro, testado em `tests/creative_tabs.rs`; o
# módulo vai para o arquivo do `Plan`, onde está `creative_tabs`, e o RETURN dele (injeção `creative_tabs`) a aplica à lista de abas já montada. Alvo cru, H43.
[[module]]
