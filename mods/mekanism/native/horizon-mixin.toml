[mod]
id = "mekanism_native"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "f319701e8c9ab657ff562250b3ba07b2d654e3bc"

[api]
path = "api"

[dependencies]
machinery_basis = "^0.1"

[[module]]
id = "rules"
file = "crates/horizon-client/src/game.rs"
name = "mekanism_rules"
source = "runtime.rs"

[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "mekanism_glue"
source = "glue.rs"

[[injection]]
id = "block_entity"
hook = "block_entity"
hook_version = 1
kind = "HEAD"
helper = "block_entity.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "entity", ty = "&mut Option<(String, horizon_world::nbt::Compound)>", value = "&mut *entity" },
]

[[injection]]
id = "block_entity_ticks"
hook = "block_entity_ticks"
hook_version = 1
kind = "HEAD"
helper = "block_entity_ticks.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "ticks", ty = "&mut bool", value = "&mut *ticks" },
]

[[injection]]
id = "block_entity_energy"
hook = "block_entity_energy"
hook_version = 1
kind = "HEAD"
helper = "block_entity_energy.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "energy", ty = "&mut Option<horizon_client::containers::ModEnergyBuffer>", value = "&mut *energy" },
]

[[injection]]
id = "block_entity_container"
hook = "block_entity_container"
hook_version = 1
kind = "HEAD"
helper = "block_entity_container.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "container", ty = "&mut Option<horizon_client::containers::ModContainer>", value = "&mut *container" },
]

[[injection]]
id = "block_entity_tick"
hook = "block_entity_tick"
hook_version = 1
kind = "HEAD"
helper = "block_entity_tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
]

[[injection]]
id = "screen"
hook = "screen"
hook_version = 1
kind = "HEAD"
helper = "screen.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "screen", ty = "&mut Option<horizon_client::mod_api::NativeScreen>", value = "&mut *screen" },
]

[[injection]]
id = "screen_draw"
hook = "screen_draw"
hook_version = 1
kind = "HEAD"
helper = "screen_draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "block", ty = "&str", value = "block" },
  { name = "data", ty = "&[i32]", value = "data" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "origin", ty = "[f32; 2]", value = "origin" },
]

[[injection]]
id = "screen_click"
hook = "screen_click"
hook_version = 1
kind = "HEAD"
helper = "screen_click.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "at", ty = "[f32; 2]", value = "at" },
  { name = "right", ty = "bool", value = "right" },
  { name = "button", ty = "&mut Option<i32>", value = "&mut *button" },
]

[[injection]]
id = "screen_tooltip"
hook = "screen_tooltip"
hook_version = 1
kind = "HEAD"
helper = "screen_tooltip.rs"
bindings = [
  { name = "block", ty = "&str", value = "block" },
  { name = "data", ty = "&[i32]", value = "data" },
  { name = "at", ty = "[f32; 2]", value = "at" },
  { name = "lines", ty = "&mut Vec<String>", value = "&mut *lines" },
]

# O tooltip da aba de avisos: o amarelo do cabeçalho é `EnumColor.YELLOW` (0xFFDD4F), que `native_screen_tooltip` não dá.
[[injection]]
id = "warning_tab_tooltip"
target = "horizon_client::game::native_hooks::Game<'_>::draw_native_screen_tooltip"
kind = "HEAD"
cancellable = true
helper = "warning_tab_tooltip.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
]

[[injection]]
id = "menu_button"
hook = "menu_button"
hook_version = 1
kind = "HEAD"
helper = "menu_button.rs"
bindings = [
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
  { name = "id", ty = "i32", value = "id" },
]

[[injection]]
id = "menu_quick_move"
hook = "menu_quick_move"
hook_version = 1
kind = "HEAD"
helper = "menu_quick_move.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "entity", ty = "&mut horizon_client::containers::ModBlockEntity", value = "&mut *entity" },
  { name = "container_slots", ty = "usize", value = "container_slots" },
  { name = "slot", ty = "usize", value = "slot" },
  { name = "stack", ty = "&mut horizon_client::items::ItemStack", value = "&mut *stack" },
  { name = "handled", ty = "&mut bool", value = "&mut *handled" },
]

[[injection]]
id = "has_analog_output"
hook = "has_analog_output"
hook_version = 1
kind = "HEAD"
helper = "has_analog_output.rs"
bindings = [
  { name = "level", ty = "&GameLevel<'_>", value = "self" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "output", ty = "&mut bool", value = "&mut *output" },
]

[[injection]]
id = "analog_output"
hook = "analog_output"
hook_version = 1
kind = "HEAD"
helper = "analog_output.rs"
bindings = [
  { name = "dimension", ty = "LevelDimension", value = "dimension" },
  { name = "pos", ty = "BlockPos", value = "pos" },
  { name = "output", ty = "&mut i32", value = "&mut *output" },
]

[[injection]]
id = "level_tick_post"
hook = "level_tick_post"
hook_version = 1
kind = "HEAD"
helper = "level_tick_post.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "dimension", ty = "&str", value = "dimension" },
]

# Quantos jogadores têm a tela do bloco aberta mudou (`ContainerOpenersCounter`: convidados que não são espectadores e o
# anfitrião). É a contagem que o `playersUsing` do Java tem, e a checagem de erros da receita depende dela.
[[injection]]
id = "mod_container_viewers"
hook = "mod_container_viewers"
hook_version = 1
kind = "HEAD"
helper = "mod_container_viewers.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "dimension", ty = "&str", value = "dimension" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "viewers", ty = "u32", value = "viewers" },
  { name = "previous", ty = "u32", value = "previous" },
]

# O componente que guarda o tipo do upgrade no item.
[[injection]]
id = "component_types"
hook = "component_types"
hook_version = 1
kind = "HEAD"
helper = "component_types.rs"
bindings = [
  { name = "types", ty = "&mut Vec<String>", value = "&mut *types" },
]

# O modelo do upgrade escolhido pelo componente: o original usa um modelo de item próprio (`mekanism:component_item`), e aqui
# a propriedade de condição `mekanism:upgrade_type/<tipo>` faz o mesmo papel.
# Shift e clique direito com o upgrade na mão (`ItemUpgrade.useOn`).
[[injection]]
id = "use_item_on"
hook = "use_item_on"
hook_version = 1
kind = "HEAD"
helper = "use_item_on.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "stack", ty = "&horizon_client::items::ItemStack", value = "stack" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "claimed", ty = "&mut bool", value = "&mut *claimed" },
]

# `mekanism:component_item` não existe no Horizon: o arquivo do item fica igual ao do original, e o tipo é decodificado aqui.
[[injection]]
id = "component_item_model"
target = "horizon_assets::item_model::foreign::decode_node"
kind = "HEAD"
cancellable = true
helper = "component_item_model.rs"
bindings = [
  { name = "kind", ty = "&str", value = "kind" },
  { name = "m", ty = "&Map<String, Value>", value = "m" },
]

[[injection]]
id = "command_components"
target = "horizon_command::item::ItemState<'_,'_>::component_type"
kind = "HEAD"
cancellable = true
helper = "command_components.rs"
bindings = [{ name = "state", ty = "&mut ItemState<'_, '_>", value = "&mut *self" }]

[[injection]]
id = "reload-listeners"
hook = "add_server_reload_listeners"
hook_version = 1
kind = "HEAD"
helper = "reload_listeners.rs"
bindings = [
  { name = "listeners", ty = "&mut Vec<crate::game::NativeReloadListener>", value = "&mut *listeners" },
]

[[injection]]
id = "reload-apply"
hook = "server_reload_listener_apply"
hook_version = 1
kind = "HEAD"
helper = "reload_apply.rs"
bindings = [
  { name = "listener", ty = "&crate::game::NativeReloadListener", value = "listener" },
  { name = "files", ty = "&[(String, serde_json::Value)]", value = "files" },
]
