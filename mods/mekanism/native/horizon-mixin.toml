# A luz do bloco aceso. As quatro máquinas são `Machine` (`Machine.java:26`), com `Attributes.ACTIVE_LIGHT`: luz 8 só no estado ativo
# (`AttributeStateActive`, `Attributes.java:27`). O gabarito `minecraft:furnace` dá 13 ao estado `lit`, e `properties.light` vale para todos
# os estados (o desligado ficaria aceso). O HEAD de `override_gameplay` troca a emissão dos estados acesos dessas máquinas. Alvo cru.
[[injection]]
id = "active_light"
target = "horizon_client_lib::mod_content::Plan<'_>::override_gameplay"
kind = "HEAD"
helper = "active_light.rs"
bindings = [
  { name = "block", ty = "&NewBlock<'_>", value = "b" },
  { name = "row", ty = "&mut J", value = "&mut *row" },
]

# `TrackingEnergyHandler.insert` → `LastEnergyTracker.received`: a energia que entra numa máquina pela capability (um cabo, um gerador ao lado) soma no
# `lastEnergyReceived` do tick. O `ModEnergyBuffer` do Horizon recebe sem passar por um ponto nosso, e todo `insert` e `move` termina em
# `native_energy_store`, que grava o valor novo no tile. Alvo cru, H37.
[[injection]]
id = "energy_store"
target = "horizon_client::game::machines::native_energy::Game<'_>::native_energy_store"
kind = "HEAD"
helper = "energy_store.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "energy", ty = "i32", value = "energy" },
]
