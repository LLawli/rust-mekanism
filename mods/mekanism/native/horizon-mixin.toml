# Os tooltips dos widgets da tela (aba de avisos, barra de energia e de químico): ficam por cima ou por baixo do widget, e o amarelo do
# cabeçalho da aba é `EnumColor.YELLOW` (0xFFDD4F), que `native_screen_tooltip` não dá.
[[injection]]
id = "widget_tooltip"
target = "horizon_client::game::native_hooks::Game<'_>::draw_native_screen_tooltip"
