# `Plan::creative_tabs` monta as linhas da aba de cada mod e a do search depois de ler as dos mods. O RETURN dele põe as pilhas de upgrade com tipo no lugar do
# `mekanism:upgrade` da aba do mod e acrescenta os itens do mod ao fim das abas do vanilla, como o evento `BuildCreativeModeTabContentsEvent` do original.
# Alvo cru, H43.
[[injection]]
