# A máquina quebrada solta a experiência guardada (`preRemoveSideEffects`).
# Uma explosão leva a máquina como o jogador: `preRemoveSideEffects` solta a experiência guardada na remoção, venha ela de onde vier. O hook
# `explosion_detonate` dá os blocos que vão quebrar, com o tile ainda no mundo.
[[injection]]
id = "explosion_detonate"
hook = "explosion_detonate"
hook_version = 1
kind = "HEAD"
helper = "explosion_detonate.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "blocks", ty = "&Vec<[i32; 3]>", value = "&*blocks" },
]

[[injection]]
id = "destroy_block"
hook = "destroy_block"
hook_version = 1
kind = "HEAD"
helper = "destroy_block.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "pos", ty = "[i32; 3]", value = "pos" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

# O jogador tira o resultado da máquina (`InventoryContainerResultSlot.onTake`): o Horizon não avisa quando um jogador tira de um
# slot de resultado de contêiner de mod. O HEAD de `lan_machine_click` (o clique no servidor, do anfitrião e dos convidados) guarda a
# saída antes do clique, e o próximo tick da máquina confere. Alvo cru. Um RETURN não serve: a função tem itens aninhados
# (`E_UNSUPPORTED_CONTROL_FLOW`).
[[injection]]
id = "result_take_before"
target = "horizon_client::game::lan_crafting::Game<'_>::lan_machine_click"
kind = "HEAD"
helper = "result_take_before.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "host", ty = "&crate::game::lan::LanHost", value = "&*host" },
  { name = "conn", ty = "u32", value = "conn" },
]

