# Só para `cargo test`: compila as regras puras do mod, sem o jogo.
[package]
name = "mekanism-rules"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
path = "native/runtime.rs"

[dependencies]
serde_json = "1"
machinery-basis-core = { path = "../machinery_basis/core" }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
