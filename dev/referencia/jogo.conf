# Lido pelo script mekanism-ref (shell POSIX). Mesmo formato do Horizon.
name=mekanism-ref
image=jogo-mekanism-ref:latest
dados="$HOME/.local/share/jogo-isolado/mekanism-ref"
fonte="$dados/src"

# O runClient usa um usuário de desenvolvimento: nenhuma conta entra aqui.
conta_dados="$dados/sem-conta"
conta_nome=

mounts="$dados"
mounts_ro="$dados/somente-leitura"

network=internet
memory=12g

backend=${HORIZON_BACKEND:-wayland}
tela="-W 1920 -H 1080 -w 1920 -h 1080 -f"

envs="FONTE=$fonte GRADLE_USER_HOME=$dados/gradle XDG_DATA_HOME=$dados/data XDG_CONFIG_HOME=$dados/config TMPDIR=$dados/tmp"

# JOGO_CMD troca o comando. Sem WAYLAND_DISPLAY o jogo usa o Xwayland do gamescope.
cmd=${JOGO_CMD:-"gamescope $tela --backend $backend -- env -u WAYLAND_DISPLAY jogar"}
