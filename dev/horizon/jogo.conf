# Lido pelo script horizon (shell POSIX). Mesmo formato da skill jogo-isolado.
name=horizon
image=jogo-horizon:latest
dados="$HOME/.local/share/jogo-isolado/horizon"

# A conta fica fora de mounts: o jogo e os mods nunca a enxergam.
conta_dados="$HOME/.local/share/jogo-isolado/horizon-conta"
conta_nome=luka_kuuhaku

# O que um mod malicioso alcança com escrita: só isto.
mounts="$dados"
# Mods entram somente leitura: um mod não altera outro.
mounts_ro="$HOME/Games/Horizon/mods"

network=internet
memory=12g

# wayland abre janela no Hyprland; headless renderiza sem depender do monitor ligado.
backend=${HORIZON_BACKEND:-wayland}
# Resolução nativa do monitor, em tela cheia no Hyprland.
tela="-W 1920 -H 1080 -w 1920 -h 1080 -f"
controle=/run/user/$(id -u)/horizon-control.sock

envs="XDG_DATA_HOME=$dados/data XDG_CONFIG_HOME=$dados/config TMPDIR=$dados/tmp HORIZON_LAUNCHER_NO_SELF_UPDATE=1 HORIZON_CONTROL=$controle"

# JOGO_CMD troca o comando: JOGO_CMD='horizon-launcher versions' horizon
# Sem WAYLAND_DISPLAY o jogo cai no Xwayland do gamescope, em vez de desenhar fora dele.
cmd=${JOGO_CMD:-"gamescope $tela --backend $backend -- env -u WAYLAND_DISPLAY jogar --world mekanism --creative --fullscreen --width 1920 --height 1080 --control-socket $controle"}
