# Servidor PulseAudio exclusivo do container: só reprodução.
# Sem carregar módulos, sem gravar (microfone ou monitor) e sem mexer em
# volume de dispositivos. Conecta no PipeWire do host como cliente restrito.
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-protocol-pulse }
]
pulse.cmd = [ ]
pulse.properties = {
    server.address = [
        { address = "unix:native" client.access = "restricted" max-clients = 16 }
    ]
    server.dbus-name = ""
    pulse.allow-module-loading = false
}
pulse.rules = [
    {
        matches = [ { aagl.nunca = null } ]  # objeto vazio não casa; chave ausente casa com todos
        actions = { quirks = [ block-record-stream block-source-volume block-sink-volume ] }
    }
]
